schema_version: ros2-joint-mapping/v1
devices:
  right_arm:
    joints: [arm.right.joint.6, arm.right.joint.5, arm.right.joint.4, arm.right.joint.3, arm.right.joint.2, arm.right.joint.1, arm.right.joint.0]
    state:
      topic: /other/state
      type: other/msg/JointReport
      positions: angles
      stamp: header.stamp
      mode: operating_mode
      ready_modes: [7]
      fault: error
      unit: degree
    action:
      name: /other/move
      type: other/action/Move
      goal_positions: q
      goal_constants: {kind: absolute}
      result_error: code
      result_description: reason
      success_code: 0
      unit: degree
    arrival_tolerance_rad: 0.015
    settle_window_s: 0.0
